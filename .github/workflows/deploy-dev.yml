name: Deploy dev

# Every push to dev: full CI, then build and deploy MCP Server to dev environment.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    secrets: inherit

  # Runs only when the repository variable DEV_DEPLOY_ENABLED is 'true' (and the
  # DEV_SSH_KEY, DEV_SSH_KNOWN_HOSTS, DEV_SSH_USER, DEV_SSH_HOST secrets are configured).
  deploy:
    needs: ci
    if: ${{ vars.DEV_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP Server
        run: pnpm run build

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy MCP Server to Dev
        env:
          TARGET: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}
        run: |
          ssh "$TARGET" 'mkdir -p ~/fatturafacile-dev/mcp-server'
          scp -rq dist package.json pnpm-lock.yaml "$TARGET":fatturafacile-dev/mcp-server/
          ssh "$TARGET" 'cd ~/fatturafacile-dev/mcp-server && pnpm install --prod --frozen-lockfile && pm2 restart mcp-server || true'
