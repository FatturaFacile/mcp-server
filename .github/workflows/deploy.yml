name: Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    secrets: inherit

  build-and-release:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP Server
        run: pnpm run build

      - name: Create release archives and generate checksums
        run: |
          TAG="${{ github.event.release.tag_name || 'v1.0.0' }}"
          ARCHIVE_NAME="fatturafacile-mcp-server-$TAG"
          mkdir -p release-pkg
          cp -r dist package.json README.md LICENSE release-pkg/

          tar -czf "${ARCHIVE_NAME}.tar.gz" -C release-pkg .

          python3 -c "
          import shutil
          shutil.make_archive('${ARCHIVE_NAME}', 'zip', 'release-pkg')
          "

          SHA_TAR=$(sha256sum "${ARCHIVE_NAME}.tar.gz" | awk '{print $1}')
          SHA_ZIP=$(sha256sum "${ARCHIVE_NAME}.zip" | awk '{print $1}')

          echo "$SHA_TAR  ${ARCHIVE_NAME}.tar.gz" > SHA256SUMS
          echo "$SHA_ZIP  ${ARCHIVE_NAME}.zip" >> SHA256SUMS

          echo "ARCHIVE_TAR=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "ARCHIVE_ZIP=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=SHA256SUMS" >> "$GITHUB_ENV"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.ARCHIVE_TAR }}" \
            "${{ env.ARCHIVE_ZIP }}" \
            "${{ env.CHECKSUM_FILE }}" \
            --clobber
